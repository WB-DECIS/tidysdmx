repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: nbstripout-local
        name: Strip Jupyter notebook outputs (local)
        entry: python -m nbstripout
        language: system
        files: "\\.ipynb$"

      - id: pytest-unit
        name: Run unit tests
        entry: poetry run pytest -m "not integration" --no-header -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
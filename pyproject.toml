[project]
name = "tidysdmx"
# Managed by python-semantic-release — never hand-edit. See RELEASING.md.
version = "0.10.0"
description = "A toolbox to work with SDMX data"
readme = "README.md"
# 3.11.9 rather than 3.11: the floor is a patch-level constraint, which the
# template's `python_min` question cannot express. Documented deviation.
requires-python = ">=3.11.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Tony Fujs", email = "tonyfujs@gmail.com" },
    { name = "Daniel Gil-Sanchez" },
]
keywords = ["sdmx", "statistics", "data", "metadata", "fmr", "pysdmx"]
# Licence classifiers are deliberately absent: PEP 639 supersedes them with the
# SPDX `license` expression above. Python version classifiers are now written by
# hand — Poetry used to synthesise them, hatchling does not.
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
dependencies = [
    "pysdmx>=1.13.0,<2",
    "pandas>=2.2.3,<3",
    "numpy>=1.26",
    "openpyxl>=3.1.5,<4",
    # typeguard is scheduled for removal once mypy reaches strict — see
    # .claude/rules/python-conventions.md. Until then it is a runtime dependency
    # because @typechecked raises TypeCheckError as part of the public contract.
    "typeguard>=4.4.4,<5",
]

[project.urls]
Homepage = "https://github.com/WB-DECIS/tidysdmx"
Repository = "https://github.com/WB-DECIS/tidysdmx"
Documentation = "https://wb-decis.github.io/tidysdmx/"
Changelog = "https://github.com/WB-DECIS/tidysdmx/blob/main/CHANGELOG.md"
Issues = "https://github.com/WB-DECIS/tidysdmx/issues"

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tidysdmx"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md"]

# ----------------------------------------------------------------------
# Dependency groups (PEP 735). `uv sync` installs `dev` by default;
# `uv sync --all-groups` installs everything.
# ----------------------------------------------------------------------
[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "mypy>=2.3",
    # Keep this in lockstep with the ruff-pre-commit rev in
    # .pre-commit-config.yaml, or a commit passes the hook and then fails CI.
    "ruff>=0.16.3",
    "pre-commit>=4.6",
]
# great-docs is pinned exactly rather than floated: it is a young, pre-1.0
# project whose config schema can still change, and an unpinned docs tool
# silently breaks the site. This replaces the previous
# `poetry run pip install great-docs`, which installed outside the lockfile.
# quarto-cli is the official Posit-published Quarto binary, so the Quarto
# version lives in uv.lock and `make docs` matches the CI docs job.
docs = ["great-docs==0.17.0", "quarto-cli==1.10.18"]
release = ["python-semantic-release>=10.2.0,<11"]
security = ["pip-audit>=2.10"]
# Documented deviation from pypackage-template, which has no notebooks. Kept out
# of `dev` so CI does not install the Jupyter stack merely to run ruff — most of
# this repository's pip-audit findings come from it.
notebooks = [
    "jupyterlab>=4.4.10",
    "ipykernel>=7.1.0",
    "ipython>=9.6.0",
    "notebook>=7.4.7",
    "nbstripout>=0.8.2",
]

# ----------------------------------------------------------------------
# Release automation — see RELEASING.md
# ----------------------------------------------------------------------
[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]
allow_zero_version = true    # stay on 0.x; without this the next release would jump to 1.0.0
major_on_zero = false        # while on 0.x, breaking changes bump minor; set true to release 1.0.0
tag_format = "v{version}"    # matches the existing v0.2.0..v0.10.0 tags
commit_message = "chore(release): {version} [skip ci]"
# `build_command` is deliberately UNSET, which means semantic-release performs no
# build. The distribution is built in a dedicated `build` job in
# .github/workflows/release.yml using this project's own uv/hatchling toolchain —
# the semantic-release action is a Docker container action, so anything installed
# on the runner (including uv) is invisible to it. This replaces the previous
# `pip install poetry && poetry build` run inside that container.

# Releases come from `main` only. This repository keeps a two-branch model
# (`dev` for integration, `main` for releases), so this stanza is what stops a
# `dev` build from ever cutting a release.
[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog]
# "update" inserts new sections under insertion_flag and leaves the
# hand-written history below it untouched.
mode = "update"
insertion_flag = "<!-- version list -->"
# Keep the changelog user-facing: only feat/fix/perf entries.
exclude_commit_patterns = [
    '''chore(?:\([^)]*?\))?: .+''',
    '''ci(?:\([^)]*?\))?: .+''',
    '''build(?:\([^)]*?\))?: .+''',
    '''refactor(?:\([^)]*?\))?: .+''',
    '''style(?:\([^)]*?\))?: .+''',
    '''test(?:\([^)]*?\))?: .+''',
    '''docs(?:\([^)]*?\))?: .+''',
]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.ruff]
src = ["src"]
target-version = "py311"
# Notebooks are exploratory and managed via nbstripout, not ruff. Linting them
# raises Jupyter-specific false positives (cross-cell imports/names), so exclude.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "D",    # pydocstyle — docstring conventions
    "E",    # pycodestyle errors
    "F",    # pyflakes — unused imports, variables, etc.
    "I",    # isort — import ordering
    "UP",   # pyupgrade — modernise syntax for target Python version
    "B",    # flake8-bugbear — common bug patterns
    "SIM",  # flake8-simplify — simplifiable constructs
    "RUF",  # Ruff-specific rules
]
ignore = [
    "D107",  # allow missing docstrings on __init__
    "D105",  # allow missing docstrings on magic methods
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Docstrings are not required anywhere in tests (module/class/method/function).
"tests/**/*.py" = ["D100", "D101", "D102", "D103", "D104", "D106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, isolated unit tests (no network)",
    "integration: tests that hit FMR or external services",
]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["src/tidysdmx"]
omit = ["src/tidysdmx/kedro.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
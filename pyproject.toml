[project]
name = "tidysdmx"
dynamic = ["version", "description", "authors", "license", "readme", "dependencies", "requires-python", "classifiers"]
keywords = ["sdmx", "statistics", "data", "metadata", "fmr", "pysdmx"]

[project.urls]
Homepage = "https://github.com/WB-DECIS/tidysdmx"
Repository = "https://github.com/WB-DECIS/tidysdmx"
Documentation = "https://wb-decis.github.io/tidysdmx/"
Changelog = "https://github.com/WB-DECIS/tidysdmx/blob/master/CHANGELOG.md"
Issues = "https://github.com/WB-DECIS/tidysdmx/issues"

[tool.poetry]
version = "0.8.0"
description = "A toolbox to work with SDMX data"
authors = ["Tony Fujs", "Daniel Gil-Sanchez"]
license = "MIT"
readme = "README.md"
packages = [{ include = "tidysdmx", from = "src" }]
# License and Python-version classifiers are auto-added by Poetry
# ("classifiers" is listed in [project] dynamic). 3.11 must be listed
# manually: auto-enrichment skips it because >=3.11.9 excludes part of 3.11.
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]

[tool.poetry.dependencies]
python = ">=3.11.9"
pysdmx = "^1.13.0"
pandas = "^2.2.3"
numpy = ">=1.26"
typeguard = "^4.4.4"
openpyxl = "^3.1.5"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^6.1.1"
python-semantic-release = {version = "^10.2.0", python = ">=3.11.9"}
myst-nb = "^1.3.0"
sphinx-autoapi = "^3.6.1"
sphinx-rtd-theme = "^3.0.2"
jupyterlab = "^4.4.10"
ipykernel = "^7.1.0"
ipython = "^9.6.0"
notebook = "^7.4.7"
ruff = "^0.14.6"
pre-commit = "^4.5.0"
nbstripout = "^0.8.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.semantic_release]
version_toml = [
    "pyproject.toml:tool.poetry.version",
]
allow_zero_version = true    # stay on 0.x; without this the next release would jump to 1.0.0
major_on_zero = false        # while on 0.x, breaking changes bump minor; set true to release 1.0.0
tag_format = "v{version}"    # matches the existing v0.2.0..v0.8.0 tags
# The release workflow's PSR container has no Poetry preinstalled.
build_command = "python -m pip install 'poetry>=2.3,<3' && poetry build"
commit_message = "chore(release): {version} [skip ci]"

[tool.semantic_release.changelog]
# "update" inserts new sections under insertion_flag and leaves the
# hand-written history below it untouched.
mode = "update"
insertion_flag = "<!-- version list -->"
# Keep the changelog user-facing: only feat/fix/perf entries.
exclude_commit_patterns = [
    '''chore(?:\([^)]*?\))?: .+''',
    '''ci(?:\([^)]*?\))?: .+''',
    '''build(?:\([^)]*?\))?: .+''',
    '''refactor(?:\([^)]*?\))?: .+''',
    '''style(?:\([^)]*?\))?: .+''',
    '''test(?:\([^)]*?\))?: .+''',
    '''docs(?:\([^)]*?\))?: .+''',
]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.ruff]
src = ["src"]
target-version = "py311"
# Notebooks are exploratory and managed via nbstripout, not ruff. Linting them
# raises Jupyter-specific false positives (cross-cell imports/names), so exclude.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "D",    # pydocstyle — docstring conventions
    "E",    # pycodestyle errors
    "F",    # pyflakes — unused imports, variables, etc.
    "I",    # isort — import ordering
    "UP",   # pyupgrade — modernise syntax for target Python version
    "B",    # flake8-bugbear — common bug patterns
    "SIM",  # flake8-simplify — simplifiable constructs
    "RUF",  # Ruff-specific rules
]
ignore = [
    "D107",  # allow missing docstrings on __init__
    "D105",  # allow missing docstrings on magic methods
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Docstrings are not required anywhere in tests (module/class/method/function).
"tests/**/*.py" = ["D100", "D101", "D102", "D103", "D104", "D106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, isolated unit tests (no network)",
    "integration: tests that hit FMR or external services",
]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["src/tidysdmx"]
omit = ["src/tidysdmx/kedro.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
name: Docs

on:
  push:
  # DEVIATION from pypackage-template, which assumes a single `main`. tidysdmx
  # keeps `dev` for integration and `main` for releases, so CI must run on both.
  # Re-apply this after `copier update`.
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so great-docs can date pages accurately.
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.11"
      # great-docs introspects the installed package (`dynamic: true` in
      # great-docs.yml), so the project itself must be installed, not just the
      # docs group.
      # Quarto arrives via the docs group (quarto-cli on PyPI), so its version is
      # pinned in uv.lock rather than in a separate setup action — the same
      # binary a contributor gets from `make docs`.
      - run: uv sync --locked --group docs
      - name: Show Quarto version
        run: uv run quarto --version
      - name: Build docs
        run: uv run great-docs build
      - name: Upload docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-html
          path: great-docs/_site
          if-no-files-found: error

  publish:
    name: Publish to GitHub Pages
    needs: build
    # Build runs on dev and on pull requests so a broken docs build is caught
    # early, but only main deploys. This is what stops the published site from
    # documenting unreleased API — the defect that made pypackage-template
    # mandate a single branch in the first place.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-html
          path: great-docs/_site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: great-docs/_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

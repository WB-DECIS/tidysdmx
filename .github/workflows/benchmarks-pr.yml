name: Benchmarks (PR)

# Benchmarks a pull request's head against its base branch and the latest
# release, and keeps one comment on the PR up to date with the result. Two
# suites, each with its own trigger paths: the `map_structures` suite runs when
# the PR touches what that function's speed depends on, and the pipeline suite
# when it touches any of the package, since the pipeline runs most of it. The
# `benchmark` label runs both.
on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read

concurrency:
  # One benchmark per PR: a new push cancels the run on the superseded head.
  # Adding any other label must not cancel a run in flight, so such an event
  # gets a group of its own (and then decides not to run).
  group: >-
    benchmarks-pr-${{ github.event.pull_request.number }}-${{
    github.event.action == 'labeled' && github.event.label.name != 'benchmark'
    && github.run_id || 'run' }}
  cancel-in-progress: true

jobs:
  decide:
    name: Decide whether to benchmark
    # Same trust model as pr-review.yml: fork PRs and drafts are skipped.
    # Dependabot-triggered runs are skipped too. Its uv PRs change uv.lock, which
    # the benchmark never reads (it installs each version with the dependencies
    # that version declares), so measuring one would only measure noise; and
    # Dependabot runs get a read-only token, so the comment could not be posted.
    if: >-
      github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mapping: ${{ steps.decide.outputs.mapping }}
      pipeline: ${{ steps.decide.outputs.pipeline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A job, not an `on.pull_request.paths` filter: that filter would also
      # drop the `labeled` event, so the label could never force a run. The
      # paths are what each suite measures: the mapping code, or the whole
      # package; plus the harness, and the dependencies pyproject.toml declares.
      - name: Check the label and the changed paths
        id: decide
        env:
          ACTION: ${{ github.event.action }}
          ADDED_LABEL: ${{ github.event.label.name }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'benchmark') }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          mapping=false
          pipeline=false
          if [ "$ACTION" = "labeled" ]; then
            if [ "$ADDED_LABEL" = "benchmark" ]; then mapping=true; pipeline=true; fi
          elif [ "$HAS_LABEL" = "true" ]; then
            mapping=true
            pipeline=true
          else
            git diff --quiet "origin/$BASE_REF...HEAD" -- \
              src/tidysdmx/mapping.py benchmarks/ pyproject.toml || mapping=true
            git diff --quiet "origin/$BASE_REF...HEAD" -- \
              src/tidysdmx/ benchmarks/ pyproject.toml || pipeline=true
          fi
          echo "mapping=$mapping" >> "$GITHUB_OUTPUT"
          echo "pipeline=$pipeline" >> "$GITHUB_OUTPUT"
          echo "Benchmark this PR: map_structures $mapping, pipeline $pipeline"

  benchmark-mapping:
    name: Benchmark map_structures
    needs: decide
    if: needs.decide.outputs.mapping == 'true'
    uses: $/.github/workflows/benchmarks.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      suite: mapping
      target-label: head
      compare: base=origin/${{ github.event.pull_request.base.ref }}
      baselines: 1
    permissions:
      contents: read

  benchmark-pipeline:
    name: Benchmark the pipeline
    needs: decide
    if: needs.decide.outputs.pipeline == 'true'
    uses: $/.github/workflows/benchmarks.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      suite: pipeline
      target-label: head
      compare: base=origin/${{ github.event.pull_request.base.ref }}
      baselines: 1
      sizes: "1000000"
    permissions:
      contents: read

  comment:
    name: Post the benchmark comment
    needs: [benchmark-mapping, benchmark-pipeline]
    # Either suite may have been skipped; post whatever ran and succeeded.
    if: >-
      !cancelled()
      && (needs.benchmark-mapping.result == 'success'
          || needs.benchmark-pipeline.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # create or edit the PR comment
    # No checkout: this job holds a write token, so it never runs PR code. It
    # only posts the Markdown the read-only benchmark jobs rendered.
    steps:
      - name: Download results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: benchmark-results-*
          merge-multiple: true
          path: results
      - name: Create or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- tidysdmx-benchmark -->'
          {
            echo "$marker"
            for summary in results/mapping-summary.md results/pipeline-summary.md; do
              if [ -f "$summary" ]; then cat "$summary"; echo; fi
            done
          } > comment.md
          id=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
            | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$id" \
              -F body=@comment.md > /dev/null
          else
            gh api --method POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
              -F body=@comment.md > /dev/null
          fi

name: Pipeline benchmark

# Runs the WB template pipeline (load, filter, structure map, map, standardize,
# validate) on mock WB_IDS bronze data of a chosen size, and reports each
# step's time and memory in the job summary and as the `pipeline-benchmark`
# artifact. The mock is generated on the runner from the committed profile, so
# no real data is needed; docs/datasets/wb-ids.md explains the dataset and how
# the mock compares with it. Manual only: nothing gates on the numbers.
#
# A standard runner has about 16 GB of RAM and 14 GB of free disk, so the real
# file's full size (147M rows, 15 GB of CSV, ~20 GB once loaded) does not fit;
# 10M rows is the largest size that leaves comfortable headroom today.
on:
  workflow_dispatch:
    inputs:
      rows:
        description: Mock rows, space-separated for several runs (real file 147000092)
        type: string
        default: "1000000 10000000"

permissions:
  contents: read

jobs:
  run:
    name: Run pipeline benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.11"
      - name: Generate and run
        env:
          ROWS: ${{ inputs.rows }}
        run: |
          mkdir -p pipeline-results
          read -r -a sizes <<< "$ROWS"
          for rows in "${sizes[@]}"; do
            csv="mock_${rows}.csv"
            uv run python -m benchmarks.wb_ids.generate --rows "$rows" --out "$csv"
            uv run python -m benchmarks.wb_ids.pipeline --csv "$csv" \
              --out "pipeline-results/pipeline_${rows}.json" \
              --summary "$GITHUB_STEP_SUMMARY"
            rm -f "$csv"
          done
      - name: Store results
        if: ${{ !cancelled() && hashFiles('pipeline-results/*.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pipeline-benchmark
          path: pipeline-results/
          if-no-files-found: error

name: Benchmarks

# Measures one ref against named refs and earlier releases, and stores the
# results as the `benchmark-results-<suite>` artifact. Two suites: `mapping`
# measures map_structures on generated dataset shapes; `pipeline` measures the
# whole WB template pipeline, step by step, on a mock WB_IDS CSV generated on
# the runner. It only reads: release.yml attaches the JSON to a Release and
# benchmarks-pr.yml posts the PR comment, each with the one write permission
# it needs. They live in the callers because a called workflow's jobs cannot
# ask for more than the caller grants, even when they would be skipped.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (or commit) to profile
        type: string
        required: true
      suite:
        description: What to measure, mapping or pipeline
        type: string
        default: mapping
      target-label:
        description: Label for the ref in the results (default the ref)
        type: string
        default: ""
      compare:
        description: Another ref to measure alongside, as LABEL=REF or REF
        type: string
        default: ""
      baselines:
        description: How many earlier releases to measure
        type: number
        default: 3
      sizes:
        description: Row counts, space-separated (default the suite's)
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (or commit) to profile
        type: string
        required: true
      suite:
        description: What to measure
        type: choice
        options: [mapping, pipeline]
        default: mapping
      target-label:
        description: Label for the ref in the results (default the ref)
        type: string
        default: ""
      compare:
        description: Another ref to measure alongside, as LABEL=REF or REF
        type: string
        default: ""
      baselines:
        description: How many earlier releases to measure
        type: number
        default: 3
      sizes:
        description: Row counts, space-separated (default the suite's)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  run:
    name: Run benchmarks
    runs-on: ubuntu-latest
    # A full mapping grid over four versions; v0.8.0's row-wise multi-map path
    # alone can take minutes at 1M rows. The pipeline suite at 1M and 10M rows
    # over four versions takes 12 to 20 minutes.
    timeout-minutes: 75
    steps:
      # The harness comes from this workflow's own commit; the versions under
      # test are exported from git by ref, so every tag and branch must be here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.11"
      - name: Benchmark
        env:
          REF: ${{ inputs.ref }}
          SUITE: ${{ inputs.suite }}
          TARGET_LABEL: ${{ inputs.target-label }}
          COMPARE: ${{ inputs.compare }}
          BASELINES: ${{ inputs.baselines }}
          SIZES: ${{ inputs.sizes }}
        run: |
          args=(--suite "$SUITE" --target "$REF" --baselines "$BASELINES" \
            --out "$SUITE-results.json")
          if [ -n "$TARGET_LABEL" ]; then args+=(--target-label "$TARGET_LABEL"); fi
          if [ -n "$COMPARE" ]; then args+=(--compare "$COMPARE"); fi
          if [ -n "$SIZES" ]; then
            read -r -a sizes <<< "$SIZES"
            args+=(--sizes "${sizes[@]}")
          fi
          uv run --no-project python -m benchmarks.run "${args[@]}"
      - name: Report
        if: ${{ !cancelled() && hashFiles(format('{0}-results.json', inputs.suite)) != '' }}
        env:
          SUITE: ${{ inputs.suite }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          uv run --no-project python -m benchmarks.report --format summary \
            --input "$SUITE-results.json" --run-url "$RUN_URL" --output "$SUITE-summary.md"
          cat "$SUITE-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Store results
        if: ${{ !cancelled() && hashFiles(format('{0}-results.json', inputs.suite)) != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results-${{ inputs.suite }}
          path: |
            ${{ inputs.suite }}-results.json
            ${{ inputs.suite }}-summary.md
          if-no-files-found: error

name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      noop:
        description: "Dry run: compute the release without changing anything (publish steps are skipped)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    name: Semantic release
    # Dispatch guard: only master may release. semantic-release's branch
    # config would refuse other branches anyway; this skips cleanly instead.
    if: github.ref_name == 'master'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write # push version commit + tag, create the GitHub Release
    outputs:
      released: ${{ steps.release.outputs.released || 'false' }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          # If master branch protection rejects the release push, create a
          # fine-grained PAT (Contents: read/write) as GH_RELEASE_TOKEN and
          # uncomment here and in the semantic-release step below.
          # token: ${{ secrets.GH_RELEASE_TOKEN }}

      - name: Force branch to workflow sha
        run: git reset --hard ${{ github.sha }}

      - name: Version, changelog, tag, GitHub Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.5.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }} # or secrets.GH_RELEASE_TOKEN, see above
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"
          no_operation_mode: ${{ inputs.noop || false }}

      # In noop mode semantic-release still reports released=true but skips
      # the build, so every step past this point must also skip.
      - name: Attach distributions to GitHub Release
        if: steps.release.outputs.released == 'true' && inputs.noop != true
        uses: python-semantic-release/publish-action@v10.5.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}

      - name: Store distribution artifacts
        if: steps.release.outputs.released == 'true' && inputs.noop != true
        uses: actions/upload-artifact@v4
        with:
          name: distribution-artifacts
          path: dist
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released == 'true' && inputs.noop != true
    environment:
      name: pypi
      url: https://pypi.org/project/tidysdmx/${{ needs.release.outputs.version }}/
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC) — no token secret needed
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: distribution-artifacts
          path: dist

      - name: Upload package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          print-hash: true

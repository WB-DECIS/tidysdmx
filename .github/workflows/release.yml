name: Release

on:
  push:
    # DEVIATION from pypackage-template's `main_dev`, which also releases from
    # `dev` as rc prereleases. `dev` here is internal integration that nobody
    # installs from, so there is no rc machinery and no
    # [tool.semantic_release.branches.dev] group. Re-apply after `copier update`.
    branches: [main]
  workflow_dispatch:
    inputs:
      noop:
        description: "Dry run: compute the release without changing anything"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    name: Semantic release
    # Dispatch guard: only main may release. semantic-release's branch config
    # would refuse anything else anyway; this skips cleanly instead of failing.
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      # Never cancel a half-finished release: it may already have tagged.
      cancel-in-progress: false
    permissions:
      contents: write # push the version commit + tag, create the GitHub Release
    outputs:
      released: ${{ steps.release.outputs.released || 'false' }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      # Credentials are deliberately persisted here (no persist-credentials:
      # false): semantic-release has to push the version commit and the tag back
      # to main. Every other checkout in this repo does disable them.
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          # If branch protection on main rejects the release push, create a
          # fine-grained PAT (Contents: read/write) as GH_RELEASE_TOKEN and
          # uncomment this line and the one in the release step below.
          # token: ${{ secrets.GH_RELEASE_TOKEN }}

      # Guards against main having moved between the trigger and the checkout.
      - name: Force branch to workflow sha
        run: git reset --hard ${{ github.sha }}

      # semantic-release computes its baseline from tags REACHABLE from the branch,
      # but checks "already released?" against the GLOBAL tag namespace. If a release
      # commit is ever orphaned — a branch reset or deletion is enough — the baseline
      # silently falls back to 0.0.0, the computed version collides with the tag that
      # still exists, and the non-strict path returns without error: a green job that
      # cuts nothing, indefinitely. Fail loudly instead.
      - name: Refuse to release while a tag is unreachable from this branch
        run: |
          # tag_format is "v{version}", so every release tag is v<digit>… Both
          # probes below must use the SAME glob: a reachable tag outside the
          # release namespace — a nightly, a vendor freeze marker — would
          # otherwise satisfy `git describe` and silence this guard entirely.
          glob='v[0-9]*'
          newest_global=$(git tag -l "$glob" --sort=-v:refname | head -1)
          if [ -z "$newest_global" ]; then
            echo "No release tags yet — nothing to check."
            exit 0
          fi
          newest_reachable=$(git describe --tags --abbrev=0 --match "$glob" 2>/dev/null || true)

          # Compare the newest tag against the newest REACHABLE tag, rather than
          # merely asking whether any reachable tag exists. The weaker check
          # passes whenever some older tag is still reachable — so with v0.9.0
          # reachable and v0.10.0 orphaned it stays silent, semantic-release
          # baselines from v0.9.0, recomputes 0.10.0, finds it in the GLOBAL tag
          # namespace, and returns without releasing. A green job that cuts
          # nothing, indefinitely.
          if [ "$newest_global" != "$newest_reachable" ]; then
            echo "::error::newest release tag $newest_global is not reachable from HEAD (newest reachable: ${newest_reachable:-none}) — a release commit was orphaned."
            echo "Merge the orphaned release commit back into this branch; a cherry-pick will not work,"
            echo "because only an ancestor relationship makes the tag visible to git describe."
            git tag -l "$glob" --sort=-v:refname
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.11"

      # semantic-release runs here as a CLI on the runner rather than via its
      # Docker container action, because `build_command = "uv lock"` needs uv and
      # a container action cannot see anything installed on the runner.
      #
      # That command is load-bearing, not a packaging step: uv.lock records the
      # project's own version, so stamping project.version without re-locking
      # leaves `uv sync --locked` failing on every subsequent CI run. PSR runs
      # build_command after writing the version and before creating the commit,
      # and `assets = ["uv.lock"]` stages the refreshed lockfile into it.
      #
      # Distributions are still built in the `build` job below, against the tag.
      - name: Version, changelog, tag, GitHub Release
        id: release
        env:
          # PSR reads GH_TOKEN for the GitHub Release (hvcs/github.py).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # or GH_RELEASE_TOKEN, see above
          NOOP: ${{ inputs.noop && '--noop' || '' }}
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com

          before=$(git rev-parse HEAD)
          # shellcheck disable=SC2086 # NOOP is intentionally word-split (empty or --noop)
          # --strict: without it, PSR exits 0 when the computed version is
          # already in the global tag namespace, hiding a stuck release.
          uv run --group release semantic-release -v --strict $NOOP version
          after=$(git rev-parse HEAD)

          # PSR only creates a commit when it actually releases, so comparing HEAD
          # is a reliable signal — and it reports false under --noop, where the
          # action's own `released` output used to report true.
          if [ "$before" = "$after" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No release was made."
            exit 0
          fi

          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Released $tag"

  # Rebuild and redeploy the site from the release tag, so the published version
  # and changelog match the release that just happened rather than lagging by one.
  deploy-docs:
    name: Publish docs for the release
    needs: release
    if: needs.release.outputs.released == 'true' && inputs.noop != true
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
    permissions:
      contents: read
      pages: write
      id-token: write

  build:
    name: Build distributions
    needs: release
    # semantic-release still reports released=true in noop mode, so every job
    # past this point must re-check the noop flag as well.
    if: needs.release.outputs.released == 'true' && inputs.noop != true
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the distributions to the GitHub Release
    steps:
      # Check out the tag semantic-release just created, so the artifacts are
      # built from exactly the released commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.11"
      - name: Build sdist and wheel
        run: uv build
      - name: Check distribution metadata
        run: uvx twine check dist/*
      - name: Verify the wheel is importable
        run: |
          uv run --isolated --no-project --with dist/*.whl \
            python -c "import tidysdmx; print(tidysdmx.__version__)"
      - name: Attach distributions to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber
      - name: Store distributions for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-artifacts
          path: dist
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [release, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tidysdmx/${{ needs.release.outputs.version }}/
    permissions:
      # PyPI Trusted Publishing (OIDC) — no API token secret needed. Also what
      # lets the action attach PEP 740 Sigstore attestations, which it does by
      # default from v1.11.0 onward.
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution-artifacts
          path: dist
      - name: Upload package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          print-hash: true

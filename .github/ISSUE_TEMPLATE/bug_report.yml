name: Bug report
description: Report something that does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please fill in enough for us to reproduce it.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: >-
        The smallest snippet that shows the problem, plus the full traceback if
        there is one.
      render: python
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "tidysdmx version"
      description: "`python -c \"import tidysdmx; print(tidysdmx.__version__)\"`"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: "`python --version`"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Ubuntu 24.04, macOS 15.3, Windows 11
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Other context, workarounds you have found, related issues.
    validations:
      required: false

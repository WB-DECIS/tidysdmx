name: Feature request
description: Suggest new functionality or a change to existing behaviour
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >-
        What are you trying to do that is currently hard or impossible? Describe
        the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to happen. A sketch of the API is welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >-
        Other approaches you weighed, including doing it outside this package.
    validations:
      required: false

  - type: dropdown
    id: breaking
    attributes:
      label: Would this be a breaking change?
      options:
        - "No — purely additive"
        - "Yes — changes existing behaviour or signatures"
        - "Not sure"
    validations:
      required: true
